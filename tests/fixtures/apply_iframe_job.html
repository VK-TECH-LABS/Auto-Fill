<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Warehouse Associate</title></head>
<body>
  <header><a href="/login">Sign in</a></header>
  <main>
    <h1>Warehouse Associate</h1>
    <p>Job description. Responsibilities and qualifications for this role.</p>
    <iframe id="apply-frame" title="Apply"></iframe>
    <section id="form" hidden>
      <h1>Application</h1>
      <label>Email <input id="email" type="email" name="email"></label>
    </section>
  </main>
  <script>
    window.__clicked = [];
    window.reveal = () => {
      window.__clicked.push("Apply");
      document.getElementById("apply-frame").remove();
      document.getElementById("form").hidden = false;
    };
    const frame = document.getElementById("apply-frame");
    const doc = frame.contentDocument;
    doc.open();
    doc.write("<!DOCTYPE html><html><body><button id='apply' type='button'>Apply</button><script>document.getElementById('apply').addEventListener('click', () => parent.reveal());<\/script></body></html>");
    doc.close();
  </script>
</body>
</html>
