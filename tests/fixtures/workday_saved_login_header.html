<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Example Analyst | Example Workday Careers</title></head>
<body>
<!--
  Synthetic Workday-style Create Account step for the 2026-10-27 saved-login smoke
  (Nordson / Barry-Wehmiller / GE Vernova / Aptiv). Mirrors the live DOM read on
  barrywehmiller.wd1 and aptiv.wd5 with POSTs blocked. No real data.
  * The header has a utility "Sign In" button (utilityButtonSignIn). It opens a
    SECOND Sign In modal over the page and submits nothing.
  * The pane's Sign In submit is aria-hidden under a nameless-to-a11y
    click_filter overlay (role=button aria-label="Sign In"), as on live Workday.
  * localStorage "result": "app" (default) shows My Information after a spinner;
    "unverified" shows Workday's verify banner; "reload" reloads the document
    (start=app) after the spinner, like a tenant that re-renders after sign-in.
  * localStorage "switchMs": the pane's Sign In link empties the pane and
    renders the Sign In pane only after that delay.
  * localStorage "armMs" (RC-S1, live barrywehmiller.wd1 with POSTs blocked): a
    Sign In press within armMs of the Sign In pane rendering is ignored (no
    request, pane unchanged). A press that counts POSTs /login first.
  * localStorage "result": "silent" POSTs /login and leaves the pane as it is.
-->
<header data-automation-id="header">
  <button type="button" data-automation-id="utilityButtonSignIn">Sign In</button>
</header>
<main>
  <h2 data-automation-id="jobPostingHeader">Example Analyst</h2>
  <ol data-automation-id="progressBar">
    <li data-automation-id="progressBarActiveStep">Create Account/Sign In</li>
    <li>My Information</li>
  </ol>
  <div id="pane"></div>
</main>
<div id="modal"></div>
<script>
window.__paneSignIn = 0;
window.__presses = 0;
window.__swallowed = 0;
window.__loginPosts = 0;
window.__modalOpened = 0;
var pane = document.getElementById("pane");
function overlayButton(id, label) {
  return '<div style="position:relative;display:inline-block">'
    + '<button type="submit" aria-hidden="true" tabindex="-1" data-automation-id="' + id + '">' + label + '</button>'
    + '<div role="button" tabindex="0" aria-label="' + label + '" data-automation-id="click_filter"'
    + ' style="position:absolute;inset:0;cursor:pointer"></div></div>';
}
function createPane() {
  pane.innerHTML = '<div data-automation-id="createAccountPage">'
    + '<h2 data-automation-id="headingText">Create Account</h2>'
    + '<form onsubmit="return false" novalidate>'
    + '<label for="input-4">Email Address</label><input id="input-4" type="text" data-automation-id="email">'
    + '<label for="input-5">Password</label><input id="input-5" type="password" data-automation-id="password">'
    + '<label for="input-6">Verify New Password</label><input id="input-6" type="password" data-automation-id="verifyPassword">'
    + overlayButton("createAccountSubmitButton", "Create Account")
    + '</form>'
    + '<p>Already have an account? <button type="button" data-automation-id="signInLink">Sign In</button></p>'
    + '</div>';
  pane.querySelector("[data-automation-id='signInLink']").addEventListener("click", function () {
    // Live aptiv.wd5: the old pane is removed at once and the Sign In pane
    // renders a moment later, so only the header "Sign In" is on screen.
    var ms = parseInt(localStorage.getItem("switchMs") || "0", 10);
    if (!ms) { signInPane(); return; }
    pane.innerHTML = "";
    setTimeout(signInPane, ms);
  });
}
function myInfoPane() {
  pane.innerHTML = '<div data-automation-id="applyFlowMyInfoPage"><h2>My Information</h2>'
    + '<label for="first">First Name</label><input id="first" type="text" data-automation-id="legalNameSection_firstName">'
    + '<label for="last">Last Name</label><input id="last" type="text" data-automation-id="legalNameSection_lastName">'
    + '<button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button></div>';
}
function signInPane() {
  pane.innerHTML = '<div data-automation-id="signInPage">'
    + '<h2 data-automation-id="headingText">Sign In</h2>'
    + '<div id="err" role="alert" data-automation-id="errorMessage"></div>'
    + '<form onsubmit="return false" novalidate data-automation-id="signInFormo">'
    + '<label for="input-14">Email Address</label><input id="input-14" type="text" data-automation-id="email">'
    + '<label for="input-15">Password</label><input id="input-15" type="password" data-automation-id="password">'
    + overlayButton("signInSubmitButton", "Sign In")
    + '</form>'
    + '<p>Don\'t have an account yet? <button type="button" data-automation-id="createAccountLink">Create Account</button></p>'
    + '</div>';
  var renderedAt = Date.now();
  pane.querySelector("[data-automation-id='click_filter']").addEventListener("click", function () {
    window.__presses += 1;
    var arm = parseInt(localStorage.getItem("armMs") || "0", 10);
    if (arm && Date.now() - renderedAt < arm) { window.__swallowed += 1; return; }
    window.__paneSignIn += 1;
    window.__loginPosts += 1;
    fetch(location.origin + "/login", { method: "POST", body: "x" }).catch(function () {});
    var result = localStorage.getItem("result") || "app";
    if (result === "silent") return;
    pane.innerHTML = '<div data-automation-id="loadingSpinner" aria-busy="true">Loading</div>';
    setTimeout(function () {
      if (result === "unverified") {
        signInPane();
        document.getElementById("err").textContent =
          "Verify your account before you sign in or request a verification email.";
        return;
      }
      if (result === "reload") { localStorage.setItem("start", "app"); location.reload(); return; }
      myInfoPane();
    }, parseInt(localStorage.getItem("spinnerMs") || "400", 10));
  });
}
document.querySelector("[data-automation-id='utilityButtonSignIn']").addEventListener("click", function () {
  // Live Workday: the header Sign In opens a modal and hides the page behind it.
  window.__modalOpened += 1;
  pane.innerHTML = "";
  document.getElementById("modal").innerHTML = '<div role="dialog" aria-modal="true" data-automation-id="popUpDialog">'
    + '<h2>Sign In</h2>'
    + overlayButton("signInSubmitButton", "Sign In") + '</div>';
});
if (localStorage.getItem("start") === "app") { localStorage.removeItem("start"); localStorage.removeItem("result"); myInfoPane(); }
else { createPane(); }
</script>
</body>
</html>
