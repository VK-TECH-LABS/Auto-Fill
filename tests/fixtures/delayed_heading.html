<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
  <main id="stage">
    <h1 id="title">Personal</h1>
    <label>Email <input id="email" type="email" name="email" value="river.example@example.com"></label>
    <button id="forward" type="button">Next</button>
  </main>
  <script>
    window.__clicked = [];
    document.getElementById("forward").addEventListener("click", () => {
      window.__clicked.push("Next");
      setTimeout(() => {
        document.getElementById("title").textContent = "Experience";
        const company = document.createElement("input");
        company.id = "company";
        company.type = "text";
        document.getElementById("stage").appendChild(company);
        document.getElementById("forward").remove();
      }, 2000);
    });
  </script>
</body>
</html>
