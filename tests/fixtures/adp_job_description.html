<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Warehouse Associate</title></head>
<body>
  <header>
    <a href="/login">Sign in</a>
    <a href="/register">Create account</a>
    <a href="/auth">Log in</a>
  </header>
  <main>
    <h1>Warehouse Associate</h1>
    <p>Job description. Responsibilities and qualifications for this role.</p>
    <button id="apply" type="button" data-automation-id="applyButton" aria-label="Apply here">Apply</button>
  </main>
  <script>
    window.__clicked = [];
    document.getElementById("apply").addEventListener("click", () => {
      window.__clicked.push("Apply");
      document.querySelector("main").innerHTML =
        "<h1>Application</h1><label>Email <input id='email' type='email' name='email'></label>";
    });
    document.querySelector("header").addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if (link) window.__clicked.push(link.textContent.trim());
    });
  </script>
</body>
</html>
