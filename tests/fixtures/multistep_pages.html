<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
  <main id="stage"></main>
  <script>
    window.__clicked = [];
    let index = 0;
    function render() {
      const stage = document.getElementById("stage");
      if (index === 0) {
        stage.innerHTML = "<h1>Personal</h1><label>Email <input id='email' type='email' name='email'></label><button id='forward' type='button'>Next</button>";
      } else if (index === 1) {
        stage.innerHTML = "<h1>Experience</h1><label>Company <input id='company' type='text' name='company'></label><button id='forward' type='button'>Save &amp; Continue</button>";
      } else {
        stage.innerHTML = "<h1>Review</h1><p>Review your application.</p><button id='submit' type='submit'>Submit application</button><button type='button' id='send'>Send</button>";
      }
      const forward = document.getElementById("forward");
      if (forward) {
        forward.addEventListener("click", () => {
          window.__clicked.push(forward.textContent.trim());
          index += 1;
          render();
        });
      }
      const submit = document.getElementById("submit");
      if (submit) {
        submit.addEventListener("click", (event) => {
          event.preventDefault();
          window.__clicked.push("Submit application");
        });
      }
      const send = document.getElementById("send");
      if (send) {
        send.addEventListener("click", (event) => {
          event.preventDefault();
          window.__clicked.push("Send");
        });
      }
    }
    render();
  </script>
</body>
</html>
