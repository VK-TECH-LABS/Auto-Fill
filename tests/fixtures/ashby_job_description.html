<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Example Engineer</title></head>
<body>
  <h1>Example Engineer</h1>
  <p>About this job. Responsibilities and qualifications.</p>
  <button type="button" id="ashby-apply">I'm interested</button>
  <button type="submit" id="send">Send application</button>
  <script>
    window.__clicked = [];
    document.getElementById("ashby-apply").addEventListener("click", () => {
      window.__clicked.push("I'm interested");
    });
    document.getElementById("send").addEventListener("click", () => {
      window.__clicked.push("Send application");
    });
  </script>
</body>
</html>
