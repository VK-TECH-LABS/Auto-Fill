<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
  <h1>Application</h1>
  <label for="email">Email</label>
  <input id="email" type="email" name="email">
  <div class="h-captcha" data-size="invisible" style="height:0;overflow:hidden">
    <iframe title="hcaptcha-invisible" src="/hcaptcha.com/invisible" style="width:0;height:0;border:0"></iframe>
  </div>
  <iframe title="hcaptcha-hidden" src="/hcaptcha.com/hidden" style="display:none;width:303px;height:78px"></iframe>
  <button type="submit">Submit application</button>
</body>
</html>
