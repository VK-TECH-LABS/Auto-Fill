<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
  <h1>Application</h1>
  <label id="name-label" for="name">Full name</label>
  <input id="name" name="name" autocomplete="name" required>
  <label id="email-label" for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <label id="phone-label" for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" autocomplete="tel" required>
  <label for="referral">Referral code</label>
  <input id="referral" name="referral" value="FRIEND">
  <label for="resume">Resume</label>
  <input id="resume" name="resume" type="file">
  <div id="chip" class="resume-upload-success" hidden>Success!</div>
  <script>
    document.getElementById("resume").addEventListener("change", () => {
      document.getElementById("chip").hidden = false;
      window.setTimeout(() => {
        const name = document.getElementById("name");
        const nextName = document.createElement("input");
        nextName.id = "name-replaced";
        nextName.name = "_systemfield_name";
        nextName.required = true;
        nextName.setAttribute("autocomplete", "name");
        name.replaceWith(nextName);
        document.getElementById("name-label").htmlFor = "name-replaced";

        const phone = document.getElementById("phone");
        const nextPhone = document.createElement("input");
        nextPhone.id = "phone-replaced";
        nextPhone.name = "phone";
        nextPhone.type = "tel";
        nextPhone.required = true;
        phone.replaceWith(nextPhone);
        document.getElementById("phone-label").htmlFor = "phone-replaced";

        document.getElementById("email").value = "parsed@example.com";
      }, 200);
    });
  </script>
</body>
</html>
