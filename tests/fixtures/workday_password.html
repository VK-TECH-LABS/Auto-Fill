<!DOCTYPE html>
<html>
<body>
<div id="cookie">We use cookies. Accept cookies to continue.</div>
<h1>Create Account</h1>
<div data-automation-id="email">
  <label for="email">Email Address</label>
  <input id="email" type="text" data-automation-id="email" autocomplete="email">
</div>
<div data-automation-id="password">
  <label for="password">Password</label>
  <div><div><div><div><div>
    <input id="password" type="password" data-automation-id="password" autocomplete="new-password">
  </div></div></div></div></div>
</div>
<div data-automation-id="verifyPassword">
  <label for="verify">Verify New Password</label>
  <input id="verify" type="password" data-automation-id="verifyPassword" autocomplete="new-password">
</div>
<div data-automation-id="passwordRequirements">
  <ul>
    <li>alphabetic character</li>
    <li>special character</li>
    <li>numeric character</li>
    <li>uppercase</li>
    <li>at least 8 characters</li>
    <li>lowercase</li>
  </ul>
</div>
<button type="button" id="create" data-automation-id="createAccountSubmitButton">Create Account</button>
</body>
</html>
