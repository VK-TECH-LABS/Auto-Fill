<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
  <h1>Application</h1>
  <label for="email">Email</label>
  <input id="email" type="email" name="email">
  <iframe title="recaptcha-enterprise" src="/recaptcha/enterprise/anchor?size=invisible"
    style="width:0;height:0;border:0"></iframe>
  <button type="button" id="next">Next</button>
  <div id="challenge" hidden>
    <iframe title="hcaptcha" src="/hcaptcha.com/checkbox" style="width:303px;height:78px;border:0"></iframe>
  </div>
  <script>
    window.__continued = false;
    document.getElementById("next").addEventListener("click", () => {
      document.getElementById("challenge").hidden = false;
      window.__continued = true;
    });
  </script>
</body>
</html>
