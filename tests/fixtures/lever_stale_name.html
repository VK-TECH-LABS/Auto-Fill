<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
  <h1>Application</h1>
  <input id="ghost" type="hidden" name="name" value="">
  <label for="name">Full name</label>
  <input id="name" name="name" required>
  <label for="resume">Resume</label>
  <input id="resume" name="resume" type="file">
  <div id="chip" class="resume-upload-success" hidden>Success!</div>
  <script>
    document.getElementById("resume").addEventListener("change", () => {
      document.getElementById("chip").hidden = false;
      document.getElementById("name").value = "River Example";
    });
  </script>
</body>
</html>
