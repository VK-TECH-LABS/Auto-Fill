<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Application</title>
<style>
  input, select { width: 240px; height: 32px; display: block; }
  .proxy {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }
</style>
</head>
<body>
  <h1>Application</h1>
  <li class="application-question">
    <label>
      <div class="application-label">Full name<span class="required">✱</span></div>
      <div class="application-field">
        <input id="name-proxy" class="proxy" name="name" required value="">
        <input id="name" name="name" required value="">
      </div>
    </label>
  </li>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="resume">Resume</label>
  <input id="resume" name="resume" type="file">
  <div id="chip" class="resume-upload-success" hidden>Success!</div>
  <script>
    document.getElementById("resume").addEventListener("change", () => {
      document.getElementById("chip").hidden = false;
      document.getElementById("name").value = "River Example";
    });
  </script>
</body>
</html>
