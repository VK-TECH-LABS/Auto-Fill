<!DOCTYPE html>
<html>
<body>
<h1>Application</h1>
<div class="ashby-application-form-field-entry">
  <div class="ashby-application-form-question-title">Want a snack?</div>
  <div>
    <button type="button" id="snack-yes" aria-pressed="false">Yes</button>
    <button type="button" id="snack-no" aria-pressed="false">No</button>
  </div>
</div>
<div class="ashby-application-form-field-entry">
  <div class="ashby-application-form-question-title">
    Do you have 7 years of experience in this role?
    <span class="ashby-application-form-question-required" aria-hidden="true">*</span>
  </div>
  <div>
    <button type="button" id="years-yes" aria-pressed="false">Yes</button>
    <button type="button" id="years-no" aria-pressed="false">No</button>
  </div>
</div>
<div class="ashby-application-form-field-entry">
  <div class="ashby-application-form-question-title">Do you have 5 years of AWS experience?</div>
  <div role="group" aria-required="true">
    <button type="button" id="aws-yes" aria-pressed="false">Yes</button>
    <button type="button" id="aws-no" aria-pressed="false">No</button>
  </div>
</div>
</body>
</html>
