<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Example Engineer</title></head>
<body>
  <header><a href="/login">Sign in</a></header>
  <main>
    <h1>Example Engineer</h1>
    <p>Job description. Responsibilities and qualifications for this role.</p>
    <button id="apply" type="button">Apply</button>
  </main>
  <script>
    window.__clicked = [];
    document.getElementById("apply").addEventListener("click", (event) => {
      event.preventDefault();
      window.__clicked.push("Apply");
    });
  </script>
</body>
</html>
