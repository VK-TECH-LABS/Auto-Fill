<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Application</title>
<!-- Name, email, phone, current company, and LinkedIn rows are copied from a
     live jobs.lever.co apply document. The 489px field width is that page's
     .application-field rule. The file input is the live opacity-0 resume control. -->
<style>
  .application .application-label { font-size: 16px; line-height: 1.4; width: 210px; }
  .application .application-field {
    position: relative;
    box-sizing: border-box;
    margin-left: 15px;
    width: 489px;
  }
  .application .application-field input[type=text],
  .application .application-field input[type=email] { display: inline-block; width: 100%; }
  .application .application-question input[type=text],
  .application .application-question input[type=email] { margin: 0; padding: 0; }
  input.invisible-resume-upload { opacity: 0; }
</style>
</head>
<body>
  <div class="application">
    <h4>Submit your application</h4>
    <ul>
      <li class="application-question resume"><label><div class="application-label">Resume/CV <span class="required">✱</span></div><div class="application-field"><input class="application-file-input invisible-resume-upload" data-qa="input-resume" id="resume-upload-input" name="resume" tabindex="-1" type="file"></div></label></li>
      <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" data-qa="name-input" name="name" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input name="email" data-qa="email-input" type="email" pattern="[a-zA-Z0-9.#$%&amp;'*+\/=?^_`{|}~][a-zA-Z0-9.!#$%&amp;'*+\/=?^_`{|}~-]*@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Phone <span class="required">✱</span></div><div class="application-field"><input type="text" data-qa="phone-input" name="phone" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Current company <span class="required">✱</span></div><div class="application-field"><input type="text" data-qa="org-input" name="org" required></div></label></li>
      <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    </ul>
  </div>
</body>
</html>
