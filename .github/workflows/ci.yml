# Pull requests into staging (integration) and main (production), plus pushes to staging.
# workflow_dispatch re-runs CI on a developer branch after the handoff bot commit.
# A push made with GITHUB_TOKEN does not start workflows by itself.
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: pip install -e ".[dev]"
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check src tests scripts
      - name: Typecheck
        run: mypy
      - name: Run tests
        run: pytest
      - name: Build
        run: |
          pip install build
          python -m build
